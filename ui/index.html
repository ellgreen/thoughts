<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f6f8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e1624" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Retrospectives for your team: write, group, vote and leave with actions." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>thoughts</title>
    <!-- Inline so a chosen theme is set before first paint. If the server ever
         sends a Content-Security-Policy, move this to public/theme.js. -->
    <script>
      try {
        var t = localStorage.getItem("thoughts.theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
